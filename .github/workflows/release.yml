name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Só Windows por enquanto. Linux e macOS podem voltar como matrix (eram ubuntu-22.04, que precisa
  # instalar os pacotes do webkit2gtk, e macos-latest com --target universal-apple-darwin).
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Restaura o cache que o warm-cache.yml salva na main: uma execução não usa caches salvos em
      # outras tags, então esta não salva o seu.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: false

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Collection ${{ github.ref_name }}
          releaseDraft: false
